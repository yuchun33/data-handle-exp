  <h2>置件機即時累積</h2>
  <table border="1" cellpadding="5">
    <tr><th>機台</th><th>Total</th><th>OK</th><th>NG</th></tr>

      <td>{{row.total}}</td>
      <td>{{row.ok}}</td>
      <td>{{row.ng}}</td>
    </tr>
  </table>
