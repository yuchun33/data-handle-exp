<div class="flex flex-col">
  @for(line of ['LINE-1', 'LINE-2', 'LINE-3']; track line) {
  <div class="m-4">
    <h1 class="text-xl font-bold">{{ line }}</h1>
    <div class="flex flex-row">
      <div class="basis-1/8">
        <app-achievement-card [iotAchievement]="mqtt.iotAchievement()"></app-achievement-card>
      </div>

      <div class="basis-7/8">
        <app-chart-component [data]="mqtt.iotData()"></app-chart-component>
      </div>
    </div>
  </div>
  }
</div>
